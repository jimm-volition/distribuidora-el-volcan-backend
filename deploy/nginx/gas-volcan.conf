# Nginx: unico punto publico (puerto 80). React + dos API detras del mismo dominio.
# Instalar en /etc/nginx/sites-available/gas-volcan y enlazar en sites-enabled.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/gas-volcan;
    index index.html;

    # Auth: /auth-service/api/v1/auth/login  ->  127.0.0.1:8081/api/v1/auth/login
    # Solo se publica /api/: Swagger y /v3/api-docs quedan internos (se ven por tunel SSH, Guia 18 paso 16).
    location /auth-service/api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pedidos: /pedidos-service/api/v1/productos  ->  127.0.0.1:8082/api/v1/productos
    location /pedidos-service/api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: recargar /catalogo, /ordenes, etc. devuelve index.html en vez de 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
