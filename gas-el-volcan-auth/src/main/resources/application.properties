# Configuracion del microservicio Auth de Gas El Volcan: Spring Boot + MySQL + JWT
spring.application.name=gas-el-volcan-auth
server.port=${SERVER_PORT:8081}

# Variables locales desde gas-el-volcan-auth/.env (no se sube a Git). Ver .env.example.
# Si no existe el archivo, se usan las variables de entorno del sistema o de IntelliJ.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gas_volcan_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# IMPORTANTE: misma clave Base64 y mismo emisor que valida gas-el-volcan-pedidos
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:gas-el-volcan-auth}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
