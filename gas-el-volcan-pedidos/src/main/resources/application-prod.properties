# Perfil de produccion (AWS EC2). Se activa con SPRING_PROFILES_ACTIVE=prod.
# Todos los valores vienen de /etc/gas-volcan/pedidos.env (EnvironmentFile de systemd), nunca de Git.

# Solo escucha en la maquina: desde Internet se entra unicamente por Nginx (puerto 80).
server.address=127.0.0.1
server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:gas-el-volcan-auth}
app.cors.allowed-origin=${FRONTEND_URL}
