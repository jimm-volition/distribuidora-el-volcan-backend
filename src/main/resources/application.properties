# Configuración del microservicio Gas El Volcán: Spring Boot + MySQL
spring.application.name=gas-el-volcan-pedidos
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gas_volcan_pedidos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:gasvolcan}
spring.datasource.password=${DB_PASSWORD:gasvolcan_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# IMPORTANTE: clave Base64 idéntica a la del JwtService de Auth
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:gas-el-volcan-auth}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
